name: solo108-booth
services:
  desk:
    build:
      context: .
      args:
        BOOTH_RUNTIME_IMAGE: ${BOOTH_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${BOOTH_IMAGE:-solo108-booth:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${BOOTH_PORT:-19908}:8000"
    volumes:
      - booth-data:/var/lib/booth
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/booth/health', timeout=3).status==200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  booth-data:
